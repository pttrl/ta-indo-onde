<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — TIO</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3"></head><body>
<header class="bar"><div class="wrap"><a class="logo" href="./">TIO<i>.</i><small>tá indo onde?</small></a><nav><a href="./">Voltar</a></nav></div></header>
<main class="page"><h1 id="tit" style="font-size:2.4rem;margin:0 0 16px">Entrar</h1>
<div class="box">
<div class="tabs"><button id="t1" class="on">Já tenho conta</button><button id="t2">Criar conta</button></div>
<label>E-mail<input id="email" type="email" autocomplete="username"></label>
<label>Senha<input id="senha" type="password" autocomplete="current-password" placeholder="mínimo 6 caracteres"></label>
<button class="btn" id="ok">Entrar</button>
<p style="color:var(--mut);margin:0;font-size:.9rem">Com uma conta você salva os eventos que quer ir. Sócios entram no painel automaticamente.</p>
</div><p id="msg" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
let novo=false;const msg=t=>$("msg").textContent=t||"";
function modo(n){novo=n;$("t1").className=n?"":"on";$("t2").className=n?"on":"";$("ok").textContent=n?"Criar conta":"Entrar";$("tit").textContent=n?"Criar conta":"Entrar";msg()}
$("t1").onclick=()=>modo(false);$("t2").onclick=()=>modo(true);
async function seguir(user){
  const {data:s,error}=await db.from("socios").select("user_id").eq("user_id",user.id).maybeSingle();
  if(error)return msg("Login ok, mas o banco ainda não foi atualizado. Rode o setup2.sql no Supabase. ("+error.message+")");
  location.href=s?"admin.html":"./";
}
$("ok").onclick=async()=>{
  msg();const email=$("email").value.trim(),password=$("senha").value;
  if(!email||password.length<6)return msg("Informe e-mail e uma senha com 6 ou mais caracteres.");
  if(novo){
    const {data,error}=await db.auth.signUp({email,password});
    if(error)return msg("Não foi possível criar a conta: "+error.message);
    if(!data.session)return msg("Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.");
    return seguir(data.user);
  }
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error)return msg(/confirm/i.test(error.message)?"Confirme seu e-mail pelo link que o Supabase enviou e depois entre.":"E-mail ou senha incorretos. ("+error.message+")");
  seguir(data.user);
};
db.auth.getSession().then(({data:{session}})=>{if(session)seguir(session.user)});
</script></body></html>
