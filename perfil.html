<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Meu perfil — TIO</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20"></head><body>
<header class="bar"><div class="wrap"><a class="logo" href="./">TIO<i>.</i><small>tá indo onde?</small></a><nav><a href="./">Voltar</a></nav></div></header>
<main class="page"><h1 style="font-size:2.2rem;margin:0 0 16px">Meu perfil</h1>
<div class="box" id="cx" hidden>
<div style="display:flex;gap:16px;align-items:center"><div class="avatar" id="av"></div>
<div style="display:grid;gap:8px;justify-items:start"><label class="btn sec" style="cursor:pointer">Trocar foto<input id="foto" type="file" accept="image/*" hidden></label><button class="btn sec" id="rmFoto" type="button" hidden>Remover foto</button></div></div>
<label>Nome<input id="nome" maxlength="60" autocomplete="name"></label>
<label>E-mail<input id="email" disabled></label>
<label class="ck"><input type="checkbox" id="promo"><span>Quero receber promoções e novidades de eventos por e-mail.</span></label>
<label class="ck"><input type="checkbox" id="loc"><span>Compartilhar minha área aproximada com o TIO (opcional). Guardamos só uma posição arredondada, de cerca de 1 km, para saber onde há mais gente e trazer eventos mais relevantes.</span></label>
<button class="btn" id="salvar">Salvar alterações</button>
<a href="redefinir.html" style="color:var(--accl)">Alterar minha senha</a>
</div><p id="msg" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(new URL(SUPABASE_URL.trim()).origin,SUPABASE_KEY.trim()),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=t=>$("msg").textContent=t||"";
let user,fotoUrl=null;
function pintar(){
  const n=($("nome").value||user.email).trim();
  $("av").innerHTML=fotoUrl&&/^https:\/\/[^\s'"()\\]+$/.test(fotoUrl)?`<img src="${fotoUrl}" alt="Sua foto">`:esc(n.charAt(0).toUpperCase());
  $("rmFoto").hidden=!fotoUrl;
}
(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session)return location.href="entrar.html";
  user=session.user;
  const {data:p}=await db.from("perfis").select("*").eq("user_id",user.id).maybeSingle();
  $("nome").value=p?.nome||user.user_metadata?.nome||"";$("email").value=user.email;$("promo").checked=!!p?.aceita_promocoes;$("loc").checked=!!p?.compartilha_local;
  fotoUrl=p?.foto_url||null;pintar();$("cx").hidden=false;
})();
$("nome").oninput=pintar;
$("foto").onchange=async()=>{
  const f=$("foto").files[0];if(!f)return;
  if(f.size>8e6)return msg("A foto passa de 8 MB. Escolha uma menor.");
  msg("Enviando foto...");
  try{
    const bmp=await createImageBitmap(f),s=Math.min(bmp.width,bmp.height),cv=document.createElement("canvas");
    cv.width=cv.height=256;
    cv.getContext("2d").drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,256,256);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85));
    const path=user.id+"/avatar.jpg";
    const {error}=await db.storage.from("avatares").upload(path,blob,{upsert:true,contentType:"image/jpeg"});
    if(error)return msg("Não enviou a foto: "+error.message);
    const url=db.storage.from("avatares").getPublicUrl(path).data.publicUrl+"?v="+Date.now();
    const {error:e2}=await db.from("perfis").upsert({user_id:user.id,email:user.email,foto_url:url},{onConflict:"user_id"});
    if(e2)return msg("A foto subiu, mas não foi salva no perfil: "+e2.message);
    fotoUrl=url;pintar();msg("Foto atualizada.");
  }catch{msg("Não consegui ler essa imagem. Tente outra.")}
};
$("rmFoto").onclick=async()=>{
  await db.storage.from("avatares").remove([user.id+"/avatar.jpg"]);
  const {error}=await db.from("perfis").upsert({user_id:user.id,email:user.email,foto_url:null},{onConflict:"user_id"});
  if(error)return msg("Não removeu: "+error.message);
  fotoUrl=null;pintar();msg("Foto removida.");
};
$("salvar").onclick=async()=>{
  const nome=$("nome").value.trim().replace(/\s+/g," ");
  if(nome.length<2)return msg("Digite seu nome.");
  const {error}=await db.from("perfis").upsert({user_id:user.id,email:user.email,nome,aceita_promocoes:$("promo").checked,compartilha_local:$("loc").checked},{onConflict:"user_id"});
  if(error)return msg("Não salvou: "+error.message);
  if(!$("loc").checked)await db.from("localizacoes").delete().eq("user_id",user.id);
  await db.auth.updateUser({data:{nome}});
  pintar();msg("Perfil salvo!");
};
</script></body></html>
