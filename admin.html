<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Painel dos sócios — TIO</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=15"></head><body>
<header class="bar"><div class="wrap"><a class="logo" href="./">TIO<i>.</i><small>tá indo onde?</small></a><nav><a href="./">Ver site</a><button id="sair">Sair</button></nav></div></header>
<main class="page wide">
<div id="bloq" hidden><h1>Acesso restrito</h1><p>Esta área é só para sócios. <a href="entrar.html">Entrar com outra conta</a></p></div>
<div id="painel" hidden>
<div class="abas" role="tablist"><button data-aba="0" class="on">Eventos</button><button data-aba="1">Avisos</button><button data-aba="2">Usuários</button></div>
<section id="p1">
<h1 id="tit" style="font-size:2rem;margin:0 0 16px">Novo evento</h1>
<div class="box">
<label>Nome do evento<input id="titulo"></label>
<div class="row"><label>Data<input id="data" type="date"></label><label>Horário<input id="hora" type="time"></label></div>
<label>Local<input id="local"></label>
<div class="row"><button class="btn sec" type="button" id="geo">Buscar local no mapa</button><span class="dica" id="geoTxt" style="align-self:center">Opcional: marque onde fica.</span></div>
<div id="mapaAdm"></div><input type="hidden" id="lat"><input type="hidden" id="lng">
<label>Link para comprar ingresso<input id="link" type="url" placeholder="https://"></label>
<label>Categoria<select id="cat"><option>Balada</option><option>Show</option><option>Festa</option><option>Bar</option><option>Cultura</option><option>Outros</option></select></label>
<label class="ck"><input type="checkbox" id="vip"><span>Tem Lista VIP</span></label>
<label class="ck"><input type="checkbox" id="cupom"><span>Tem cupom de desconto</span></label>
<label class="ck"><input type="checkbox" id="dest"><span>Destaque (aparece em "Bombando")</span></label>
<label>Imagem do evento (até 3 MB)<input id="img" type="file" accept="image/*"></label>
<img id="pv" class="pv" alt="" hidden>
<div class="row"><button class="btn" id="salvar">Salvar evento</button><button class="btn sec" id="cancelar">Limpar</button></div>
</div>
<h2 style="font-size:1.2rem">Eventos cadastrados</h2><div id="lista"></div>
</section>
<section id="p2" hidden>
<h1 style="font-size:2rem;margin:0 0 6px">Avisos</h1><p class="dica" style="margin-bottom:14px">Aparecem no sino do site para todo mundo.</p>
<div class="box"><label>Texto do aviso (até 280 caracteres)<textarea id="avTxt" maxlength="280" rows="3"></textarea></label><label>Link do aviso (opcional)<input id="avLink" type="url" placeholder="https://"></label><button class="btn" id="avEnviar">Enviar aviso</button></div>
<div id="avLista"></div>
</section>
<section id="p3" hidden>
<h1 style="font-size:2rem;margin:0 0 6px">Usuários</h1><p class="dica" style="margin-bottom:14px">Pessoas que criaram conta no TIO.</p>
<div class="box"><label>Buscar por nome ou e-mail<input id="uBusca"></label>
<div class="row"><button class="btn sec" id="uCopiar">Copiar e-mails com promoções</button><button class="btn sec" id="uRecarregar">Atualizar lista</button></div></div>
<p class="dica" id="uTotal" style="margin-top:12px"></p><div id="uLista"></div>
</section>
</div><p id="msg" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(new URL(SUPABASE_URL.trim()).origin,SUPABASE_KEY.trim()),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=t=>$("msg").textContent=t||"";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let items=[],editId=null,imgAtual=null;
function limpar(){editId=null;imgAtual=null;["titulo","data","hora","local","link","img","lat","lng"].forEach(i=>$(i).value="");$("cat").value="Balada";["vip","cupom","dest"].forEach(i=>$(i).checked=false);$("pv").hidden=true;$("tit").textContent="Novo evento";if(mk){mA.removeLayer(mk);mk=null}$("geoTxt").textContent="Opcional: marque onde fica."}
async function carregar(){
  const {data,error}=await db.from("eventos").select("*").gte("data",iso(new Date())).order("data").order("hora");
  if(error)return msg("Erro ao carregar: "+error.message);
  items=data;
  $("lista").innerHTML=items.length?items.map(e=>`<div class="it"><div><b>${esc(e.titulo)}</b><small>${esc(e.data.split("-").reverse().join("/"))} ${e.hora?e.hora.slice(0,5):""} · ${esc(e.local)}</small></div><div><button class="btn sec" data-ed="${e.id}">Editar</button><button class="btn sec" data-ex="${e.id}">Excluir</button></div></div>`).join(""):"<p>Nenhum evento futuro cadastrado.</p>";
}
let mA,mk;
function setLL(la,ln){$("lat").value=la.toFixed(6);$("lng").value=ln.toFixed(6);$("geoTxt").textContent="📍 Local marcado. Arraste o pino ou clique no mapa para ajustar."}
function ponto(la,ln,z){
  if(!mk){mk=L.marker([la,ln],{draggable:true}).addTo(mA);mk.on("dragend",()=>{const p=mk.getLatLng();setLL(p.lat,p.lng)})}else mk.setLatLng([la,ln]);
  if(z)mA.setView([la,ln],z);setLL(la,ln);
}
function iniciarMapa(){
  if(mA)return;
  mA=L.map("mapaAdm").setView([-22.9068,-43.1729],11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(mA);
  mA.on("click",e=>ponto(e.latlng.lat,e.latlng.lng));
}
$("geo").onclick=async()=>{
  const b=$("local").value.trim();if(!b)return msg("Escreva o local antes de buscar no mapa.");
  $("geoTxt").textContent="Buscando...";
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q="+encodeURIComponent(b+", Rio de Janeiro"));
    const j=await r.json();
    if(!j.length){$("geoTxt").textContent="Não achei esse local. Clique no mapa para marcar.";return}
    ponto(+j[0].lat,+j[0].lon,16);
  }catch{$("geoTxt").textContent="A busca falhou. Clique no mapa para marcar o local."}
};

async function carregarAv(){
  const {data,error}=await db.from("avisos").select("*").order("criado_em",{ascending:false}).limit(20);
  if(error)return msg("Erro ao carregar avisos: "+error.message);
  $("avLista").innerHTML=data.length?data.map(a=>`<div class="it"><div><b>${esc(a.texto)}</b>${a.link?`<small>🔗 ${esc(a.link)}</small>`:""}<small>${new Date(a.criado_em).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</small></div><div><button class="btn sec" data-avx="${a.id}">Excluir</button></div></div>`).join(""):"<p>Nenhum aviso enviado ainda.</p>";
}
$("avEnviar").onclick=async()=>{
  const texto=$("avTxt").value.trim();if(!texto)return msg("Escreva o aviso antes de enviar.");
  const link=$("avLink").value.trim();
  if(link&&!/^https?:\/\//i.test(link))return msg("O link precisa começar com https://");
  const {error}=await db.from("avisos").insert({texto,link:link||null});
  if(error)return msg("Não enviou: "+error.message);
  $("avTxt").value="";$("avLink").value="";msg("Aviso enviado.");carregarAv();
};
$("avLista").onclick=async e=>{
  const id=e.target.dataset.avx;
  if(id&&confirm("Excluir este aviso?")){const {error}=await db.from("avisos").delete().eq("id",id);msg(error?"Não excluiu: "+error.message:"Aviso excluído.");carregarAv()}
};

function aba(n){["p1","p2","p3"].forEach((p,i)=>$(p).hidden=i!==n);document.querySelectorAll(".abas button").forEach((b,i)=>b.classList.toggle("on",i===n));if(n===2&&!users.length)carregarUsers();if(n===0&&mA)setTimeout(()=>mA.invalidateSize(),60);msg()}
document.querySelector(".abas").onclick=e=>{const n=e.target.dataset.aba;if(n!==undefined)aba(+n)};
let users=[],socios=new Set();
async function carregarUsers(){
  const [p,s]=await Promise.all([db.from("perfis").select("*").order("criado_em",{ascending:false}),db.from("socios").select("user_id")]);
  if(p.error)return msg("Erro ao carregar usuários: "+p.error.message);
  users=p.data;socios=new Set((s.data||[]).map(x=>x.user_id));renderU();
}
function renderU(){
  const q=$("uBusca").value.trim().toLowerCase();
  const f=users.filter(u=>!q||(u.nome||"").toLowerCase().includes(q)||(u.email||"").toLowerCase().includes(q));
  $("uTotal").textContent=f.length+" de "+users.length+" usuários";
  $("uLista").innerHTML=f.length?f.map(u=>`<div class="it"><div><b>${esc(u.nome||"(sem nome)")}</b>${socios.has(u.user_id)?'<span class="tg">Sócio</span>':""}${u.aceita_promocoes?'<span class="tg">Promoções</span>':""}<small>${esc(u.email)} · desde ${new Date(u.criado_em).toLocaleDateString("pt-BR")}</small></div><div><button class="btn sec" data-rs="${u.user_id}">Redefinir senha</button></div></div>`).join(""):"<p>Nenhum usuário encontrado.</p>";
}
$("uBusca").oninput=renderU;$("uRecarregar").onclick=carregarUsers;
$("uCopiar").onclick=async()=>{
  const l=users.filter(u=>u.aceita_promocoes&&u.email).map(u=>u.email);
  if(!l.length)return msg("Ninguém aceitou receber promoções ainda.");
  try{await navigator.clipboard.writeText(l.join(", "));msg(l.length+" e-mail(s) copiado(s).")}catch{msg("Não consegui copiar automaticamente.")}
};
$("uLista").onclick=async e=>{
  const id=e.target.dataset.rs;if(!id)return;
  const u=users.find(x=>x.user_id===id);
  if(!u||!confirm("Enviar e-mail de redefinição de senha para "+u.email+"?"))return;
  const {error}=await db.auth.resetPasswordForEmail(u.email,{redirectTo:new URL("redefinir.html",location.href).href});
  msg(error?"Não enviou: "+error.message:"E-mail de redefinição enviado para "+u.email+".");
};

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session)return location.href="entrar.html";
  const {data:s}=await db.from("socios").select("user_id").eq("user_id",session.user.id).maybeSingle();
  if(!s){$("bloq").hidden=false;return}
  $("painel").hidden=false;iniciarMapa();carregar();carregarAv();
})();
$("sair").onclick=async()=>{await db.auth.signOut();location.href="./"};
$("cancelar").onclick=()=>{limpar();msg()};
$("img").onchange=()=>{const f=$("img").files[0];if(f){$("pv").src=URL.createObjectURL(f);$("pv").hidden=false}};
$("salvar").onclick=async()=>{
  if(!$("titulo").value.trim()||!$("data").value||!$("local").value.trim())return msg("Preencha nome, data e local.");
  let url=imgAtual;const f=$("img").files[0];
  if(f){
    if(f.size>3e6)return msg("A imagem passa de 3 MB. Escolha uma menor.");
    const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
    const path=crypto.randomUUID()+"."+ext;
    const {error:ue}=await db.storage.from("imagens").upload(path,f);
    if(ue)return msg("A imagem não foi enviada: "+ue.message);
    url=db.storage.from("imagens").getPublicUrl(path).data.publicUrl;
  }
  const reg={titulo:$("titulo").value.trim(),data:$("data").value,hora:$("hora").value||null,local:$("local").value.trim(),link_ingresso:$("link").value.trim()||null,categoria:$("cat").value,imagem_url:url,lat:$("lat").value?+$("lat").value:null,lng:$("lng").value?+$("lng").value:null,lista_vip:$("vip").checked,cupom:$("cupom").checked,destaque:$("dest").checked};
  const {error}=editId?await db.from("eventos").update(reg).eq("id",editId):await db.from("eventos").insert(reg);
  if(error)return msg("Não salvou: "+error.message);
  limpar();msg("Evento salvo.");carregar();
};
$("lista").onclick=async e=>{
  const ed=e.target.dataset.ed,ex=e.target.dataset.ex;
  if(ed){const x=items.find(i=>i.id===ed);editId=ed;imgAtual=x.imagem_url;$("titulo").value=x.titulo;$("data").value=x.data;$("hora").value=x.hora?x.hora.slice(0,5):"";$("local").value=x.local;$("link").value=x.link_ingresso||"";$("cat").value=x.categoria;if(x.lat!=null&&x.lng!=null)ponto(x.lat,x.lng,16);else{if(mk){mA.removeLayer(mk);mk=null}$("lat").value="";$("lng").value="";$("geoTxt").textContent="Opcional: marque onde fica."}$("vip").checked=!!x.lista_vip;$("cupom").checked=!!x.cupom;$("dest").checked=!!x.destaque;$("pv").hidden=!x.imagem_url;if(x.imagem_url)$("pv").src=x.imagem_url;$("tit").textContent="Editar evento";scrollTo(0,0)}
  if(ex&&confirm("Excluir este evento?")){const {error}=await db.from("eventos").delete().eq("id",ex);msg(error?"Não excluiu: "+error.message:"Evento excluído.");carregar()}
};
</script></body></html>
