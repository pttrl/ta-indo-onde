<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda de rolês</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFF8;--ink:#1B1640;--mut:#6B6890;--acc:#E8345F;--card:#fff;--line:#DAD6EC}
@media(prefers-color-scheme:dark){:root{--bg:#151232;--ink:#F1EFF8;--mut:#A9A5CC;--card:#201C45;--line:#33305E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:640px;margin:auto;padding:24px 16px 64px}
h1{font-size:2.4rem;font-weight:800;line-height:1.05;margin:8px 0 4px}h2{font-size:1.2rem;margin:36px 0 12px}
.sub{color:var(--mut);margin:0 0 16px;text-transform:capitalize}
.ev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.ev b{font-size:1.05rem}.ev p{margin:2px 0;color:var(--mut)}.tag{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.ev a{display:inline-block;margin-top:8px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;padding:6px 14px;border-radius:8px}
.hora{color:var(--acc);font-weight:800}.vazio{color:var(--mut);padding:8px 0}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;text-transform:capitalize;font-weight:600}
.nav button{background:none;border:0;color:var(--ink);font-size:1.4rem;cursor:pointer;padding:4px 12px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.g span{color:var(--mut);font-size:.8rem}
.g button{aspect-ratio:1;border:0;border-radius:10px;background:none;color:var(--ink);font:inherit;cursor:pointer;position:relative}
.g button.has::after{content:"";position:absolute;bottom:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
.g button.sel{background:var(--ink);color:var(--bg)}.g button.hoje{outline:2px solid var(--acc)}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body><main>
<p class="sub" id="dataHoje"></p><h1>Hoje</h1>
<div id="hoje" style="margin-top:16px"></div>
<h2>Escolha um dia</h2>
<div class="cal"><div class="nav"><button id="prev" aria-label="Mês anterior">‹</button><span id="mes"></span><button id="next" aria-label="Próximo mês">›</button></div><div class="g" id="grade"></div></div>
<p class="sub" id="selTxt" style="margin-top:16px"></p><div id="dia"></div>
<h2>Próximos eventos</h2><div id="feed"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(s,o)=>new Date(s+"T00:00").toLocaleDateString("pt-BR",o);
const hoje=iso(new Date());let ev=[],sel=hoje,cur=new Date();cur.setDate(1);
function card(e,showDate){
  const ok=/^https?:\/\//i.test(e.link_ingresso||"");
  return `<div class="ev"><b>${esc(e.titulo)}</b> <span class="tag">${esc(e.categoria)}</span>
  <p>${showDate?esc(fmt(e.data,{weekday:"short",day:"numeric",month:"short"}))+" · ":""}<span class="hora">${e.hora?e.hora.slice(0,5):"Horário a confirmar"}</span> · ${esc(e.local)}</p>
  ${ok?`<a href="${esc(e.link_ingresso)}" target="_blank" rel="noopener">Comprar ingresso</a>`:""}</div>`;
}
const lista=(arr,showDate,msg)=>arr.length?arr.map(e=>card(e,showDate)).join(""):`<div class="vazio">${msg}</div>`;
function cal(){
  const y=cur.getFullYear(),m=cur.getMonth();
  $("mes").textContent=cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  let h="DSTQQSS".split("").map(l=>`<span>${l}</span>`).join("");
  for(let i=0;i<cur.getDay();i++)h+="<i></i>";
  for(let d=1;d<=new Date(y,m+1,0).getDate();d++){
    const k=iso(new Date(y,m,d));
    h+=`<button data-d="${k}" class="${ev.some(e=>e.data===k)?"has ":""}${k===sel?"sel ":""}${k===hoje?"hoje":""}">${d}</button>`;
  }
  $("grade").innerHTML=h;
}
function render(){
  $("dataHoje").textContent=fmt(hoje,{weekday:"long",day:"numeric",month:"long"});
  $("hoje").innerHTML=lista(ev.filter(e=>e.data===hoje),false,"Nenhum evento cadastrado para hoje.");
  $("selTxt").textContent=fmt(sel,{weekday:"long",day:"numeric",month:"long"});
  $("dia").innerHTML=lista(ev.filter(e=>e.data===sel),false,"Nada cadastrado para este dia.");
  $("feed").innerHTML=lista(ev.filter(e=>e.data>hoje).slice(0,30),true,"Ainda não há eventos próximos.");
  cal();
}
$("grade").onclick=e=>{if(e.target.dataset.d){sel=e.target.dataset.d;render()}};
$("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);cal()};
$("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);cal()};
db.from("eventos").select("*").gte("data",hoje).order("data").order("hora").then(({data,error})=>{
  if(error){$("hoje").innerHTML='<div class="vazio">Não foi possível carregar os eventos agora.</div>';return}
  ev=data;render();
});
render();
</script></body></html>
