<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIO — eventos da cidade</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4"></head><body>
<header class="bar"><div class="wrap"><a class="logo" href="./">TIO<i>.</i><small>tá indo onde?</small></a>
<nav id="nav"><a class="on" href="entrar.html">Entrar</a></nav></div></header>
<main class="wrap">
<section class="hero"><p id="dataSel"></p><h1 id="h1">O que rola hoje</h1></section>
<div class="days" id="dias" aria-label="Escolha um dia"></div>
<label class="outra">Outra data: <input type="date" id="outra"></label>
<div class="grid" id="dia"></div>
<h2>Próximos eventos</h2><div class="chips" id="chips"></div><div class="grid" id="feed"></div>
</main>
<footer>TIO — atualizada pelos sócios</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(s,o)=>new Date(s+"T00:00").toLocaleDateString("pt-BR",o);
const okUrl=u=>/^https:\/\/[^\s'"()\\]+$/.test(u||"");
const EMO={Balada:"🪩",Show:"🎸",Festa:"🎉",Bar:"🍸",Cultura:"🎭",Outros:"✨"};
const hoje=iso(new Date());let ev=[],favs=new Set(),user=null,filtro="Todos",sel=hoje;
function card(e,showDate){
  const img=okUrl(e.imagem_url),f=favs.has(e.id),ok=/^https?:\/\//i.test(e.link_ingresso||"");
  return `<article class="card"><div class="img" data-c="${esc(e.categoria)}" ${img?`style="background-image:url('${e.imagem_url}')"`:""}>${img?"":EMO[e.categoria]||"✨"}<button class="fav${f?" on":""}" data-f="${e.id}" aria-label="Quero ir">${f?"♥":"♡"}</button></div>
  <div class="body"><span class="tag">${esc(e.categoria)}</span><h3>${esc(e.titulo)}</h3>
  <p class="when">${showDate?esc(fmt(e.data,{weekday:"short",day:"numeric",month:"short"}))+" · ":""}${e.hora?e.hora.slice(0,5):"Horário a confirmar"}</p><p>${esc(e.local)}</p>
  ${ok?`<a class="btn" href="${esc(e.link_ingresso)}" target="_blank" rel="noopener">Comprar ingresso</a>`:""}</div></article>`;
}
const lista=(a,sd,m)=>a.length?a.map(e=>card(e,sd)).join(""):`<div class="vazio">${m}</div>`;
function strip(){
  const ds=[];for(let i=0;i<30;i++){const d=new Date();d.setDate(d.getDate()+i);ds.push(iso(d))}
  if(!ds.includes(sel))ds.unshift(sel);
  $("dias").innerHTML=ds.map(k=>{
    const d=new Date(k+"T00:00"),n=ev.filter(e=>e.data===k).length,g=d.getDay();
    const wd=d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),mes=d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
    return `<button class="day${k===sel?" sel":""}${g===5||g===6?" fds":""}${k===hoje?" hj":""}" data-d="${k}"><span class="w">${k===hoje?"Hoje":wd}</span><b>${d.getDate()}</b><span class="m">${mes}</span><span class="n${n?" on":""}">${n?n+(n>1?" rolês":" rolê"):"livre"}</span></button>`}).join("");
}
function render(){
  $("dataSel").textContent=fmt(sel,{weekday:"long",day:"numeric",month:"long"});
  $("h1").textContent=sel===hoje?"O que rola hoje":"O que rola nesse dia";
  $("dia").innerHTML=lista(ev.filter(e=>e.data===sel),false,"Nada cadastrado para este dia ainda.");
  const cats=["Todos","Balada","Show","Festa","Bar","Cultura","Outros"].concat(user?["Favoritos"]:[]);
  $("chips").innerHTML=cats.map(c=>`<button data-k="${c}" class="${c===filtro?"on":""}">${c==="Favoritos"?"♥ Quero ir":c}</button>`).join("");
  const f=ev.filter(e=>e.data>hoje&&(filtro==="Todos"||(filtro==="Favoritos"?favs.has(e.id):e.categoria===filtro)));
  $("feed").innerHTML=lista(f.slice(0,40),true,"Nenhum evento encontrado nesta seleção.");
  strip();
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-d],[data-k],[data-f]")||e.target,d=t.dataset;
  if(d.d){sel=d.d;render()}
  if(d.k){filtro=d.k;render()}
  if(d.f){
    if(!user)return location.href="entrar.html";
    if(favs.has(d.f)){favs.delete(d.f);await db.from("favoritos").delete().eq("evento_id",d.f)}
    else{favs.add(d.f);await db.from("favoritos").insert({evento_id:d.f})}
    render();
  }
});
$("outra").onchange=e=>{if(e.target.value&&e.target.value>=hoje){sel=e.target.value;render()}};
(async()=>{
  render();
  const {data:{session}}=await db.auth.getSession();user=session?.user||null;
  if(user){
    const {data:s}=await db.from("socios").select("user_id").eq("user_id",user.id).maybeSingle();
    $("nav").innerHTML=(s?'<a href="admin.html" class="on">Painel</a>':"")+'<button id="sair">Sair</button>';
    $("sair").onclick=async()=>{await db.auth.signOut();location.reload()};
    const {data:f}=await db.from("favoritos").select("evento_id");favs=new Set((f||[]).map(x=>x.evento_id));
  }
  const {data,error}=await db.from("eventos").select("*").gte("data",hoje).order("data").order("hora");
  if(error){$("hoje").innerHTML='<div class="vazio">Não foi possível carregar os eventos agora.</div>';return}
  ev=data;render();
})();
</script></body></html>
